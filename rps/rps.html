<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="rps.css">
</head>
<body>
  <h2 class="title">ROCK PAPER SCISSOR GAME</h2>
  <button class="icon-btn" onclick="play('rock')"><img src="images/rock.jpeg" class="icon" ></button>
  <button class="icon-btn" onclick="play('paper')"><img src="images/paper.jpeg" class="icon"></button>
  <button class="icon-btn" onclick="play('scissor')"><img src="images/scissor.jpeg" class="icon"></button>
  <br><br>

  <p id="result" class="result"></p>
  <p id="message"></p>
  <p id="score" class="result"></p>

    <button onclick="resetScore()" class="reset-btn">Reset</button>
  <script src="rps.js">
    
  </script>
</body>
</html>
