<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="rps.css">
</head>
<body>
  <h2 class="title">ROCK PAPER SCISSOR GAME</h2>
  <button class="icon-btn rock" >
  <img src="rock.jpeg" class="icon">
</button>
<button class="icon-btn paper" >
  <img src="paper.jpeg" class="icon">
</button>
<button class="icon-btn scissor" >
  <img src="scissor.jpeg" alt="scissorimg" class="icon">
</button><br><br>

  <p id="result" class="result"></p>
  <p id="message"></p>
  <p id="score" class="result"></p>

  <button  class="reset-btn">Reset</button>
  <button class="autoplay reset-btn">auto play</button>


  <script src="rps.js"></script>
</body>
</html>
