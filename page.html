<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>Youtube subscribe Button</h4>
    <button onclick="subscribe(event)" class="subscribe">Subscribe</button>

    <h3> Rock Paper Scissor Game</h3>
    <a href="index.html">Play Game</a>

    <h4>Amazon shipping calculator</h4>
    <input type="number" id="weight" onkeydown="handle(event)" placeholder="Enter weight in kg">
    <button onclick="calculateShipping()" >Calculate Shipping</button>
    <p class="shipping-cost"></p>
    <p class ="total-cost"></p>



    <script>
        function subscribe(){
            const btn = document.querySelector('.subscribe');
            if (btn.innerText === "Subscribed"){
                btn.innerText = "Subscribe";
                return;
            }
            else 
            btn.innerText = "Subscribed";   
        }

        function handle(event){
            if (event.key === 'Enter')
            calculateShipping();
        }

        function calculateShipping(){
            
            const value = document.querySelector('#weight').value;
            const price =Number(value);
            if (price <500 ){
                const ship=50;
                let cost= price+ship
                document.querySelector('.shipping-cost').innerHTML = `Shipping cost is ${ship} Rs`;
                document.querySelector('.total-cost').innerHTML = `Total cost is ${cost} Rs`;
            }
            else {
                let cost= price;
                document.querySelector('.shipping-cost').innerHTML = `Free Shipping`;
                document.querySelector('.total-cost').innerHTML = `Total cost is ${cost} Rs`;

            }
        }
        

    </script>
</body>
</html>
